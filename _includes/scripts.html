<script>
(function () {
  const container = document.getElementById('floatingCta');
  const toggle = document.getElementById('floatingCtaToggle');
  const menu = document.getElementById('floatingCtaMenu');
  if (!container || !toggle || !menu) return;
  function setOpen(open, restoreFocus = false) {
    menu.hidden = !open;
    container.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (restoreFocus) toggle.focus();
  }
  function updateVisibility() {
    const visible = window.scrollY > 260;
    if (!visible) {
      const hadFocus = container.contains(document.activeElement);
      setOpen(false);
      if (hadFocus) document.querySelector('.brand')?.focus();
    }
    container.hidden = !visible;
    container.classList.toggle('is-visible', visible);
  }
  toggle.addEventListener('click', () => setOpen(menu.hidden));
  document.addEventListener('click', event => {
    if (!container.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !menu.hidden) setOpen(false, true);
  });
  window.addEventListener('scroll', updateVisibility, { passive: true });
  updateVisibility();
})();
</script>
