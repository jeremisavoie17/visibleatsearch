<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
  
<body class="{{ page.body_class | default: '' }}">
  <a class="skip-link" href="#main-content">{% if page.lang == "fr" %}Aller au contenu{% else %}Skip to content{% endif %}</a>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WC6L83GW"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  {% include nav.html %}

  <main id="main-content" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include floating-cta.html %}
  {% include scripts.html %}

</body>
</html>
